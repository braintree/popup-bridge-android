plugins {
    id 'com.android.application'
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.braintreepayments.popupbridge.demo'

    defaultConfig {
        applicationId 'com.braintreepayments.popupbridge.demo'
        minSdkVersion rootProject.minSdkVersion
        compileSdk rootProject.compileSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode rootProject.versionCode
        versionName rootProject.versionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation project(':PopupBridge')
    implementation libs.appcompat

    androidTestImplementation libs.device.automator
    androidTestImplementation libs.core
    // device-automator pulls androidx.test.ext:junit, which depends on a vulnerable junit:junit:4.12.
    // Depending on it directly at a patched version lets Gradle's normal highest-version resolution win.
    androidTestImplementation libs.junit
}
