[versions]
# Demo App
appcompatVersion = "1.7.0"
browserSwitchVersion = "3.5.1"
coreVersion = "1.6.1"
datastorePreferencesVersion = "1.1.4"
detekt = "1.23.6"
deviceAutomatorVersion = "1.0.0"
androidGradlePlugin = "8.13.2"
junitVersion = "4.13.2"
kotlinAndroidVersion = "2.1.10"
kotlinxCoroutinesTestVersion = "1.10.2"
lifecycleRuntimeVersion = "2.8.7"
mockitoCoreVersion = "5.7.0"
mockkVersion = "1.13.17"
robolectricVersion = "4.11.1"
nexusPublishPluginVersion = "1.1.0"

# Transitive dependency security overrides (pulled in by AGP's buildscript classpath).
# These force patched versions without changing AGP/Kotlin itself. See Dependabot alerts.
bouncyCastleVersion = "1.85"
jose4jVersion = "0.9.6"
jdom2Version = "2.0.6.1"
commonsCompressVersion = "1.26.1"
nettyVersion = "4.1.137.Final"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompatVersion" }
browser-switch = { module = "com.braintreepayments.api:browser-switch", version.ref = "browserSwitchVersion" }
core = { module = "androidx.test:core", version.ref = "coreVersion" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferencesVersion" }
detekt-rules-libraries = { module = "io.gitlab.arturbosch.detekt:detekt-rules-libraries", version.ref = "detekt" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
device-automator = { module = "com.braintreepayments:device-automator", version.ref = "deviceAutomatorVersion" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
junit = { module = "junit:junit", version.ref = "junitVersion" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlinAndroidVersion" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTestVersion" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycleRuntimeVersion" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCoreVersion" }
mockk = { module = "io.mockk:mockk", version.ref = "mockkVersion" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectricVersion" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastleVersion" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncyCastleVersion" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncyCastleVersion" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4jVersion" }
jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2Version" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompressVersion" }
netty-common = { module = "io.netty:netty-common", version.ref = "nettyVersion" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "nettyVersion" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "nettyVersion" }
netty-resolver = { module = "io.netty:netty-resolver", version.ref = "nettyVersion" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "nettyVersion" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "nettyVersion" }
netty-codec-http2 = { module = "io.netty:netty-codec-http2", version.ref = "nettyVersion" }
netty-codec-socks = { module = "io.netty:netty-codec-socks", version.ref = "nettyVersion" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "nettyVersion" }
netty-handler-proxy = { module = "io.netty:netty-handler-proxy", version.ref = "nettyVersion" }
netty-transport-native-unix-common = { module = "io.netty:netty-transport-native-unix-common", version.ref = "nettyVersion" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinAndroidVersion" }
nexus-publish-plugin = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexusPublishPluginVersion" }
